<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- TravelWorld Logo -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66b3ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Globe icon -->
  <circle cx="25" cy="25" r="18" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  <ellipse cx="25" cy="25" rx="8" ry="18" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="7" y1="25" x2="43" y2="25" stroke="url(#logoGradient)" stroke-width="2"/>
  <path d="M 25 7 Q 35 25 25 43" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  <path d="M 25 7 Q 15 25 25 43" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Text -->
  <text x="50" y="30" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#343a40">TravelWorld</text>
</svg>
